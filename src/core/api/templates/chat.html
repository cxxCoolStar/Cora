<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClawBot Local Chat</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f3efe6;
            --panel: #fffaf0;
            --ink: #1f2937;
            --muted: #6b7280;
            --accent: #1d4ed8;
            --line: #d6d3d1;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #fff8e7 0%, var(--bg) 55%, #e8e1d1 100%);
            color: var(--ink);
        }
        .shell {
            max-width: 920px;
            margin: 32px auto;
            background: rgba(255, 250, 240, 0.94);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }
        .hero {
            padding: 24px 28px 12px;
        }
        .hero h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }
        .hero p {
            margin: 0;
            color: var(--muted);
        }
        .hero .links {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }
        .hero .links a {
            color: white;
            background: var(--accent);
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 999px;
            font-size: 14px;
        }
        .board {
            padding: 20px 28px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            min-height: 260px;
        }
        .log {
            display: grid;
            gap: 14px;
        }
        .entry {
            padding: 14px 16px;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid #ece7df;
        }
        .entry.bot {
            background: #eef4ff;
        }
        .entry.error {
            background: #fff1f2;
            border-color: #fecdd3;
        }
        .entry strong {
            display: block;
            margin-bottom: 6px;
        }
        form {
            padding: 20px 28px 28px;
            display: grid;
            gap: 12px;
        }
        textarea, input[type="file"], input[type="text"] {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            font: inherit;
            box-sizing: border-box;
            background: white;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        button {
            justify-self: start;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            font: inherit;
            padding: 12px 18px;
            cursor: pointer;
        }
        .session {
            color: var(--muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="hero">
            <h1>ClawBot Local Chat</h1>
            <p>Use this page to simulate sending text, links, and files before WeChat integration.</p>
            <div class="links">
                <a href="/debug">Open Debug Explorer</a>
            </div>
        </section>
        <section class="board">
            <div class="session" id="sessionLabel">No session yet</div>
            <div class="log" id="log"></div>
        </section>
        <form id="chatForm">
            <textarea id="text" name="text" placeholder="Paste text or a link here..."></textarea>
            <input id="file" name="file" type="file" />
            <button type="submit">Send To ClawBot</button>
        </form>
    </main>
    <script>
        const log = document.getElementById("log");
        const form = document.getElementById("chatForm");
        const sessionLabel = document.getElementById("sessionLabel");
        let sessionId = null;

        function appendEntry(kind, title, content) {
            const entry = document.createElement("div");
            entry.className = `entry ${kind}`;
            entry.innerHTML = `<strong>${title}</strong><div>${content}</div>`;
            log.prepend(entry);
        }

        async function ensureSession() {
            if (sessionId) return sessionId;
            const response = await fetch("/sessions", { method: "POST" });
            const data = await response.json();
            sessionId = data.session_id;
            sessionLabel.textContent = `Session: ${sessionId}`;
            return sessionId;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const id = await ensureSession();
            const text = document.getElementById("text").value.trim();
            const fileInput = document.getElementById("file");
            if (!text && !fileInput.files.length) {
                return;
            }
            const formData = new FormData();
            if (text) {
                formData.append("text", text);
            }
            if (fileInput.files.length) {
                formData.append("file", fileInput.files[0]);
            }
            appendEntry("user", "You", text || `[Uploaded a file] ${fileInput.files[0].name}`);
            try {
                const response = await fetch(`/sessions/${id}/ingest`, {
                    method: "POST",
                    body: formData,
                });
                const data = await response.json();
                if (!response.ok) {
                    const detail = data.detail || "Unknown error";
                    appendEntry("error", "ClawBot Error", detail);
                    return;
                }
                appendEntry("bot", "ClawBot", data.reply);
                form.reset();
            } catch (error) {
                appendEntry("error", "ClawBot Error", error.message || "Request failed");
            }
        });
    </script>
</body>
</html>
